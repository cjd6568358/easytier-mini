name: Dispatch test

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Anything, for testing only'
        required: false
        default: hello
        type: string

permissions:
  contents: read

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Echo input
        env:
          NOTE: ${{ inputs.note }}
        run: echo "dispatch works - $NOTE"
